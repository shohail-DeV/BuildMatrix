<div id="brt-root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
#brt-root, #brt-root * { box-sizing: border-box; }
#brt-root {
  --bg: #0e1410;
  --panel: #141c17;
  --panel2: #1a241d;
  --line: #2a3a2e;
  --text: #d9e6dc;
  --dim: #7f9b87;
  --amber: #e8b04b;
  --green: #5fb87a;
  --red: #d9685f;
  --gray: #6b7670;
  --mono: 'JetBrains Mono','SF Mono',Consolas,monospace;
  --sans: 'IBM Plex Sans',system-ui,sans-serif;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  border-radius: 12px;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line);
}
#brt-root .topbar {
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  padding: 14px 20px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg,#161f19,#121912);
}
#brt-root .brand { display:flex; align-items:center; gap:10px; }
#brt-root .brand .dot { width:9px;height:9px;border-radius:50%; background: var(--green); box-shadow:0 0 8px var(--green); }
#brt-root .brand b { font-family: var(--mono); letter-spacing:0.5px; font-size:14px; }
#brt-root .brand span { color: var(--dim); font-size:12px; font-family: var(--mono); }
#brt-root .tabs { display:flex; gap:4px; flex-wrap:wrap; }
#brt-root .tab {
  font-family: var(--mono); font-size:12px; padding:7px 13px; border-radius:7px;
  cursor:pointer; color: var(--dim); border:1px solid transparent; user-select:none;
}
#brt-root .tab:hover { color: var(--text); }
#brt-root .tab.active { background: var(--panel2); color: var(--amber); border-color: var(--line); }
#brt-root .body { padding: 18px 20px 22px; }
#brt-root .panel { display:none; }
#brt-root .panel.active { display:block; }

#brt-root textarea {
  width:100%; min-height: 220px; background:#0a0f0b; color:#bcd6c4; border:1px solid var(--line);
  border-radius:8px; padding:12px; font-family: var(--mono); font-size:12px; line-height:1.6; resize:vertical;
}
#brt-root textarea:focus { outline:none; border-color: var(--green); }
#brt-root .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
#brt-root .btn {
  font-family: var(--mono); font-size:12px; padding:9px 16px; border-radius:7px; cursor:pointer;
  background: var(--panel2); color: var(--text); border:1px solid var(--line); transition: all .15s; white-space:nowrap;
}
#brt-root .btn:hover { border-color: var(--green); color: var(--green); }
#brt-root .btn.primary { background: #1d3322; border-color: #2f5238; color: var(--green); }
#brt-root .btn.primary:hover { background:#234027; }
#brt-root .btn.warn { color: var(--red); }
#brt-root .btn:disabled { opacity:.4; cursor:not-allowed; }
#brt-root .hint { color: var(--dim); font-size:12px; font-family: var(--mono); margin-top:8px; line-height:1.6; }
#brt-root .statline { display:flex; gap:14px; margin-top:14px; flex-wrap:wrap; }
#brt-root .stat { background: var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 16px; min-width:100px; }
#brt-root .stat .n { font-family: var(--mono); font-size:20px; font-weight:600; }
#brt-root .stat .l { font-size:11px; color: var(--dim); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
#brt-root .stat.ok .n { color: var(--green); }
#brt-root .stat.bad .n { color: var(--red); }
#brt-root .stat.warn .n { color: var(--amber); }

#brt-root table { width:100%; border-collapse: collapse; font-size:12.5px; }
#brt-root th { text-align:left; padding:8px 10px; color: var(--dim); font-weight:500; border-bottom:1px solid var(--line); font-family: var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.04em; position: sticky; top:0; background: var(--bg); }
#brt-root td { padding:7px 10px; border-bottom:1px solid #1c2620; vertical-align:middle; }
#brt-root tr:hover td { background: #121a14; }
#brt-root .tablewrap { max-height: 420px; overflow:auto; border:1px solid var(--line); border-radius:8px; margin-top:14px; }
#brt-root .pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-family: var(--mono); }
#brt-root .pill.success { background:#163524; color: var(--green); }
#brt-root .pill.failed { background:#3a1d1a; color: var(--red); }
#brt-root .pill.unstable { background:#3a3018; color: var(--amber); }
#brt-root .pill.unknown { background:#23282a; color: var(--gray); }
#brt-root input[type=text], #brt-root select {
  background:#0a0f0b; color: var(--text); border:1px solid var(--line); border-radius:5px;
  padding:5px 8px; font-family: var(--mono); font-size:12px; width:100%;
}
#brt-root input[type=text]:focus, #brt-root select:focus { outline:none; border-color: var(--green); }
#brt-root .jobcell { font-family: var(--mono); color:#9fc2ac; font-size:11.5px; }
#brt-root .muted { color: var(--dim); }
#brt-root .matrix-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; margin-top:10px; }
#brt-root table.matrix { min-width: 920px; }
#brt-root table.matrix td.num { font-family: var(--mono); text-align:center; }
#brt-root table.matrix td.num.zero { color: #3d4a40; }
#brt-root table.matrix td.num.has { color: var(--green); font-weight:600; }
#brt-root table.matrix th.envcol { text-align:center; }
#brt-root .empty { text-align:center; padding: 40px 20px; color: var(--dim); font-family: var(--mono); font-size:12.5px; }
#brt-root .empty .big { font-size:30px; margin-bottom:8px; }
#brt-root .toast {
  position:absolute; bottom:18px; right:18px; background:#1d3322; border:1px solid #2f5238; color: var(--green);
  font-family: var(--mono); font-size:12px; padding:9px 14px; border-radius:7px; opacity:0; transform:translateY(6px);
  transition: all .25s; pointer-events:none;
}
#brt-root .toast.show { opacity:1; transform:translateY(0); }
#brt-root .badge-count { font-family: var(--mono); background: var(--panel2); border:1px solid var(--line); border-radius: 5px; padding: 1px 7px; font-size:11px; color: var(--dim); }
#brt-root .unmapped-banner {
  margin-top:14px; padding:10px 14px; border-radius:8px; background:#1d1410; border:1px solid #3a2a18;
  font-family: var(--mono); font-size:12px; color: var(--amber); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
}
#brt-root ::-webkit-scrollbar { width:9px; height:9px; }
#brt-root ::-webkit-scrollbar-thumb { background:#2a3a2e; border-radius:5px; }
</style>
<script>
(function(){
  const root = document.getElementById('brt-root');
  const ENVS = ['Dev','Test','Stg','Prod','Audit','UAT'];
  const ENV_PATTERNS = [
    [/(^|[_\-])dev($|[_\-])/i, 'Dev'],
    [/(^|[_\-])uat($|[_\-])/i, 'UAT'],
    [/(^|[_\-])audit($|[_\-])/i, 'Audit'],
    [/(^|[_\-])(prod|production)($|[_\-])/i, 'Prod'],
    [/(^|[_\-])(stg|stag|staging)($|[_\-])/i, 'Stg'],
    [/(^|[_\-])test($|[_\-])/i, 'Test'],
  ];

  const DEFAULT_MASTER = [{"buildName": "BNRC", "projectName": "Development of Technology Platform for Bihar Nurse", "server": "JENKINSMASTER"}, {"buildName": "CSIDC", "projectName": "CSIDC LANDMAS", "server": "JENKINSMASTER"}, {"buildName": "dharmabihar", "projectName": "Dharma Vihar Website Development", "server": "JENKINSMASTER"}, {"buildName": "FCI", "projectName": "FCI Website", "server": "JENKINSMASTER"}, {"buildName": "iitgnl", "projectName": "IITGNL (e-LMS)", "server": "JENKINSMASTER"}, {"buildName": "mission_shakti", "projectName": "Mo Sarkar CR - Mission Shakti Helpline_AMC", "server": "JENKINSMASTER"}, {"buildName": "NJB", "projectName": "Schemes Automation of National Jute Board", "server": "JENKINSMASTER"}, {"buildName": "ODOO", "projectName": "ODOO ERP", "server": "JENKINSMASTER"}, {"buildName": "ORERA", "projectName": "ORERA 2.0 SYSTEM", "server": "JENKINSMASTER"}, {"buildName": "CWC", "projectName": "web portal and mobile app for Reservoir Storage sy", "server": "192.168.10.169"}, {"buildName": "IRMS", "projectName": "Odisha IT Policy 2022 - Incentive Claim", "server": "192.168.10.169"}, {"buildName": "LCNC", "projectName": "Low Code No Code", "server": "JENKINSMASTER"}, {"buildName": "SUGAM", "projectName": "GO-SUGAM 2.0", "server": "192.168.10.169"}, {"buildName": "eWRS", "projectName": "Electronic Warehouse Receipt System", "server": "JENKINSMASTER2"}, {"buildName": "i4ms", "projectName": "Additional deployment of DSA (i4MS)", "server": "JENKINSMASTER1"}, {"buildName": "OMCMISATS", "projectName": "OMC- MIS ATS", "server": "JENKINS MASTER1"}, {"buildName": "RMS", "projectName": "RoyaltyManagementSystem Kenya", "server": "JENKINS MASTER1"}, {"buildName": "SAMS", "projectName": "SAMS CR - NEET & JEE Coaching (Attendance & Mark)-Enhancement", "server": "172.16.190.164"}, {"buildName": "SPDP", "projectName": "SPDP Odisha", "server": "OSDC"}, {"buildName": "BIS", "projectName": "Bureau of Indian Standards", "server": "OCI"}, {"buildName": "SAFAL", "projectName": "SAFAL Change Request - OSCB Integration", "server": "JENKINSMASTER"}, {"buildName": "NLC_INDIA", "projectName": "NLC_INDIA_LTD", "server": "JENKINSMASTER1"}, {"buildName": "contact_center", "projectName": "Contact Center, Odisha", "server": "JENKINSMASTER"}, {"buildName": "phedgrms", "projectName": "GRM Software PHED", "server": "JENKINSMASTER2"}, {"buildName": "OWD", "projectName": "OWD - Project Monitoring Dashboard", "server": "JENKINSMASTER1"}, {"buildName": "SWP", "projectName": "Chhattisgarh Industries Single Window Portal", "server": "JENKINSMASTER"}, {"buildName": "EAP", "projectName": "Electronics Auction Platform (EAP)", "server": "192.168.10.170"}, {"buildName": "KHANIJ", "projectName": "Khanij 2.0", "server": "JENKINSMASTER1"}, {"buildName": "JIMMS2.0", "projectName": "JIMMS PORTAL2.0", "server": "JENKINSMASTER1"}, {"buildName": "IPMM", "projectName": "INTERNAL PROJECT MONITORING MODULE", "server": "192.168.10.170"}, {"buildName": "LMS", "projectName": "LMS - BSDM", "server": "JENKINSMASTER"}, {"buildName": "NAFED", "projectName": "Source Enterprise Resource Planning (ERP) Solution for\u00a0NAFED", "server": "192.168.10.189"}, {"buildName": "cg-sudanidaan", "projectName": "CG SUDA - Operation of NIDAAN 1100 - Online Public Grievance Redressal System", "server": "JENKINS MASTER2"}, {"buildName": "Nation Eservice", "projectName": "national_service", "server": "JENKINS MASTER2"}, {"buildName": "OSSP", "projectName": "Odisha State Scholarship Portal", "server": "JENKINS MASTER2"}, {"buildName": "SRIS", "projectName": "Social Registry Information System", "server": "JENKINS MASTER2"}, {"buildName": "State_Dashboard_Odisha", "projectName": "State Dashboard Odisha", "server": "JENKINS MASTER1,2"}, {"buildName": "JSWPMS", "projectName": "Port Management System (PMS)", "server": "JENKINS MASTER1"}, {"buildName": "RAJ MINES", "projectName": "Raj Mines application", "server": "192.168.10.189"}, {"buildName": "CG", "projectName": "CG-dashboard", "server": "JENKINS MASTER2"}, {"buildName": "mtcos", "projectName": "Malawi Transport Corridor Observatory System", "server": "192.168.10.189"}, {"buildName": "Krushak Odisha", "projectName": "Krushak Odisha - Unified Farmer Database", "server": "OSDC"}, {"buildName": "OCAC", "projectName": "Jana Sunani Extension (Till 31 May 2026)", "server": "JENKINS MASTER2"}, {"buildName": "IWMMS", "projectName": "Chhattisgarh Industries Solid Waste Management", "server": "JENKINS MASTER2"}, {"buildName": "FARD", "projectName": "Fisheries & Animal Resources Development Department", "server": "JENKINS MASTER2"}, {"buildName": "campa", "projectName": "Campa(CSR)", "server": "JENKINS MASTER2"}];

  let state = {
    records: [],       // {jobRaw, build, time, statusRaw, statusNorm}
    jobMap: {},         // jobRaw -> {buildName, module, env}
    master: null,        // [{buildName, projectName, server}]
    month: new Date().toISOString().slice(0,7)
  };

  function normStatus(s){
    s = (s||'').trim().toLowerCase();
    if (!s || s === '?') return 'unknown';
    if (s === 'aborted') return 'unstable';
    if (s.startsWith('broken')) return 'failed';
    if (s === 'stable' || s.startsWith('back to normal')) return 'success';
    return 'unknown';
  }
  function guessEnv(name){
    for (const [re, env] of ENV_PATTERNS) if (re.test(name)) return env;
    return '';
  }
  function baseToken(name){
    let parts = name.split('»').map(s=>s.trim());
    let last = parts[parts.length-1];
    let base = last.replace(/[_\-](test|stg|stag|staging|prod|production|dev|uat|audit)$/i,'');
    return base;
  }
  function guessBuildName(name){
    const base = baseToken(name).toLowerCase();
    let best = null;
    (state.master||[]).forEach(m => {
      const bn = m.buildName.toLowerCase();
      if (base === bn || base.startsWith(bn) || base.replace(/[_\-]/g,'') === bn.replace(/[_\-]/g,'')) {
        if (!best || bn.length > best.length) best = m.buildName;
      }
    });
    return best || '';
  }

  function parseInput(text){
    const lines = text.split('\n').map(l=>l.replace(/\r/,'')).filter(l => l.trim().length>0);
    const records = [];
    const skipHeader = new Set(['s','build','time since','status','console output','↑']);
    let i = 0;
    while (i < lines.length) {
      const line = lines[i].trim();
      if (skipHeader.has(line.toLowerCase())) { i++; continue; }
      if (line.toLowerCase() === 'console output') { i++; continue; }
      const next = lines[i+1] ? lines[i+1].trim() : '';
      const m = next.match(/^#(\d+)\t([^\t]*)\t([^\t]*)/);
      if (m) {
        records.push({ jobRaw: line, build: m[1], time: m[2].trim(), statusRaw: m[3].trim(), statusNorm: normStatus(m[3].trim()) });
        i += 2;
        if (lines[i] && lines[i].trim().toLowerCase()==='console output') i++;
      } else { i++; }
    }
    return records;
  }

  function uniqueJobs(records){
    const set = new Set();
    records.forEach(r => set.add(r.jobRaw));
    return Array.from(set);
  }

  async function loadState(){
    try {
      const res = await window.storage.get('jenkins-job-map');
      if (res && res.value) state.jobMap = JSON.parse(res.value);
    } catch(e){ state.jobMap = {}; }
    try {
      const res2 = await window.storage.get('jenkins-master-list');
      if (res2 && res2.value) state.master = JSON.parse(res2.value);
    } catch(e){ /* not set yet */ }
    if (!state.master) { state.master = DEFAULT_MASTER.slice(); saveMaster(); }
  }
  async function saveJobMap(){ try { await window.storage.set('jenkins-job-map', JSON.stringify(state.jobMap)); } catch(e){} }
  async function saveMaster(){ try { await window.storage.set('jenkins-master-list', JSON.stringify(state.master)); } catch(e){} }

  function ensureMapEntries(){
    uniqueJobs(state.records).forEach(j => {
      if (!state.jobMap[j]) {
        state.jobMap[j] = { buildName: guessBuildName(j), module: '', env: guessEnv(j) };
      }
    });
  }

  function masterByName(bn){ return (state.master||[]).find(m => m.buildName === bn); }

  function buildMatrix(){
    // buildName -> module -> env -> success count
    const matrix = {};
    state.records.forEach(r => {
      const map = state.jobMap[r.jobRaw];
      if (!map || !map.buildName || !map.env) return;
      if (r.statusNorm !== 'success') return;
      const mod = map.module || '';
      matrix[map.buildName] = matrix[map.buildName] || {};
      matrix[map.buildName][mod] = matrix[map.buildName][mod] || {};
      matrix[map.buildName][mod][map.env] = (matrix[map.buildName][mod][map.env] || 0) + 1;
    });
    return matrix;
  }

  function stats(){
    const total = state.records.length;
    const success = state.records.filter(r=>r.statusNorm==='success').length;
    const failed = state.records.filter(r=>r.statusNorm==='failed').length;
    const unstable = state.records.filter(r=>r.statusNorm==='unstable').length;
    const unknown = state.records.filter(r=>r.statusNorm==='unknown').length;
    const unsuccessful = failed + unstable + unknown;
    const jobs = uniqueJobs(state.records).length;
    const mapped = uniqueJobs(state.records).filter(j => state.jobMap[j] && state.jobMap[j].buildName && state.jobMap[j].env).length;
    return {total, success, failed, unstable, unknown, unsuccessful, jobs, mapped};
  }

  function toast(msg){
    const t = root.querySelector('.toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1800);
  }

  let activeTab = 'paste';

  function render(){
    const s = stats();
    const matrix = buildMatrix();
    const buildNames = Object.keys(matrix).sort((a,b)=>a.localeCompare(b));

    root.innerHTML = `
      <div class="topbar">
        <div class="brand"><div class="dot"></div><b>BUILD MATRIX</b><span>monthly Jenkins release report</span></div>
        <div class="tabs">
          <div class="tab ${activeTab==='paste'?'active':''}" data-tab="paste">1. Paste history</div>
          <div class="tab ${activeTab==='map'?'active':''}" data-tab="map">2. Map successful builds ${s.jobs?`<span class="badge-count">${s.mapped}/${s.jobs}</span>`:''}</div>
          <div class="tab ${activeTab==='master'?'active':''}" data-tab="master">Master project list <span class="badge-count">${(state.master||[]).length}</span></div>
          <div class="tab ${activeTab==='matrix'?'active':''}" data-tab="matrix">3. Matrix & export</div>
        </div>
      </div>
      <div class="body">

        <div class="panel ${activeTab==='paste'?'active':''}">
          <div class="row" style="margin-top:0; justify-content:space-between;">
            <span class="hint" style="margin-top:0;">Paste raw text copied from Jenkins build history. Counted as <b style="color:var(--green)">Successful</b>: "stable" and "back to normal". Everything else (broken, aborted, "?") counts as <b style="color:var(--red)">Unsuccessful</b> — totalled automatically, no mapping needed.</span>
            <label class="hint" style="margin-top:0;">Report month <input type="text" id="monthInput" value="${state.month}" style="width:110px;display:inline-block;margin-left:6px;"></label>
          </div>
          <textarea id="pasteArea" placeholder="S&#10;Build&#10;Time Since&#10;Status&#10;odoo12_stg&#10;#451\t27 min\tstable\t&#10;Console output&#10;..."></textarea>
          <div class="row">
            <div class="btn primary" id="parseBtn">Parse build history</div>
            <div class="btn warn" id="clearBtn">Clear records</div>
            <span class="hint" style="margin-top:0;">${s.total ? `${s.total} records loaded` : 'No records parsed yet'}</span>
          </div>
          ${s.total ? `
          <div class="statline">
            <div class="stat ok"><div class="n">${s.success}</div><div class="l">Successful</div></div>
            <div class="stat bad"><div class="n">${s.unsuccessful}</div><div class="l">Unsuccessful (total)</div></div>
            <div class="stat"><div class="n">${s.failed}</div><div class="l">— Failed</div></div>
            <div class="stat"><div class="n">${s.unstable}</div><div class="l">— Aborted</div></div>
            <div class="stat"><div class="n">${s.unknown}</div><div class="l">— Unclassified (?)</div></div>
            <div class="stat"><div class="n">${s.jobs}</div><div class="l">Unique jobs</div></div>
          </div>` : ''}
        </div>

        <div class="panel ${activeTab==='map'?'active':''}">
          ${s.jobs===0 ? `<div class="empty"><div class="big">···</div>Paste and parse build history first.</div>` : `
          <div class="row" style="margin-top:0; justify-content:space-between;">
            <span class="hint" style="margin-top:0;">Only <b style="color:var(--green)">successful</b> builds need mapping — pick the matching Build Name from your master project list, add a Module if this job is a sub-component, and set the Environment. Failed/aborted/unclassified jobs are listed below for reference but don't need mapping. Corrections are remembered for next month.</span>
            <div class="btn" id="reGuessBtn">Re-run auto-guess</div>
          </div>
          <div class="tablewrap">
            <table>
              <thead><tr><th>Jenkins job</th><th>Builds</th><th>Status mix</th><th>Build Name</th><th>Module (optional)</th><th>Environment</th></tr></thead>
              <tbody id="mapBody"></tbody>
            </table>
          </div>
          `}
        </div>

        <div class="panel ${activeTab==='master'?'active':''}">
          <div class="row" style="margin-top:0; justify-content:space-between;">
            <span class="hint" style="margin-top:0;">This is your fixed project roster (Build Name, Project Name, Jenkins Server) — same shape as the DASHBOARD sheet's master list. It's pre-loaded from your template and persists every month. Edit, add, or remove rows as your project list changes.</span>
            <div class="btn" id="addMasterRow">+ Add project</div>
          </div>
          <div class="tablewrap">
            <table>
              <thead><tr><th style="width:40px;">#</th><th>Build Name</th><th>Project Name</th><th>Jenkins Server</th><th style="width:40px;"></th></tr></thead>
              <tbody id="masterBody"></tbody>
            </table>
          </div>
        </div>

        <div class="panel ${activeTab==='matrix'?'active':''}">
          ${s.unsuccessful>0 ? `<div class="unmapped-banner"><span>⚠ ${s.unsuccessful} unsuccessful build${s.unsuccessful===1?'':'s'} this month (${s.failed} failed, ${s.unstable} aborted, ${s.unknown} unclassified) — counted in total, excluded from the matrix below.</span></div>` : ''}
          ${buildNames.length===0 ? `<div class="empty"><div class="big">···</div>No mapped successful builds yet. Complete steps 1 and 2 first.</div>` : `
          <div class="row" style="margin-top:0; justify-content:space-between;">
            <span class="hint" style="margin-top:0;">Successful-build counts only, matching DASHBOARD layout. Month: <b style="color:var(--amber)">${state.month}</b></span>
            <div class="btn primary" id="exportBtn">Export to .xlsx</div>
          </div>
          <div class="matrix-wrap">
            <table class="matrix">
              <thead><tr><th>#</th><th>Build Name</th><th>Project Name</th><th>Server</th>${ENVS.map(e=>`<th class="envcol">${e}</th>`).join('')}<th class="envcol">Total</th></tr></thead>
              <tbody>
                ${buildNames.map((bn,idx)=>{
                  const meta = masterByName(bn) || {projectName:'', server:''};
                  const modules = matrix[bn];
                  const modKeys = Object.keys(modules);
                  const multiModule = modKeys.length > 1 || (modKeys.length===1 && modKeys[0] !== '');
                  let projectTotal = 0;
                  const moduleRows = modKeys.map(mod => {
                    const row = modules[mod];
                    let total = 0;
                    const cells = ENVS.map(e=>{ const v=row[e]||0; total+=v; return `<td class="num ${v?'has':'zero'}">${v||'–'}</td>`; }).join('');
                    projectTotal += total;
                    if (!multiModule) return '';
                    return `<tr><td class="muted"></td><td class="muted" style="padding-left:26px;">↳ ${mod || '(unspecified)'}</td><td></td><td></td>${cells}<td class="num has">${total}</td></tr>`;
                  }).join('');
                  if (!multiModule) {
                    const row = modules[modKeys[0]] || {};
                    const cells = ENVS.map(e=>{ const v=row[e]||0; return `<td class="num ${v?'has':'zero'}">${v||'–'}</td>`; }).join('');
                    return `<tr><td class="muted">${idx+1}</td><td>${bn}</td><td class="muted">${meta.projectName}</td><td class="muted">${meta.server}</td>${cells}<td class="num has">${projectTotal}</td></tr>`;
                  }
                  const totalCells = ENVS.map(e=>{
                    let v=0; modKeys.forEach(mod=> v += (modules[mod][e]||0));
                    return `<td class="num ${v?'has':'zero'}">${v||'–'}</td>`;
                  }).join('');
                  return `<tr style="background:#121a14;"><td class="muted">${idx+1}</td><td><b>${bn}</b></td><td class="muted">${meta.projectName}</td><td class="muted">${meta.server}</td>${totalCells}<td class="num has"><b>${projectTotal}</b></td></tr>${moduleRows}`;
                }).join('')}
              </tbody>
            </table>
          </div>
          `}
        </div>

      </div>
      <div class="toast"></div>
    `;

    root.querySelectorAll('.tab').forEach(t => t.onclick = () => { activeTab = t.dataset.tab; render(); });

    const monthInput = root.querySelector('#monthInput');
    if (monthInput) monthInput.onchange = (e) => { state.month = e.target.value; };

    const parseBtn = root.querySelector('#parseBtn');
    if (parseBtn) parseBtn.onclick = () => {
      const text = root.querySelector('#pasteArea').value;
      if (!text.trim()) { toast('Paste some build history first'); return; }
      const recs = parseInput(text);
      if (recs.length === 0) { toast('Could not find any recognizable build rows'); return; }
      state.records = state.records.concat(recs);
      ensureMapEntries();
      saveJobMap();
      toast(`Parsed ${recs.length} build records`);
      activeTab = 'map';
      render();
    };
    const clearBtn = root.querySelector('#clearBtn');
    if (clearBtn) clearBtn.onclick = () => { state.records = []; render(); };

    const mapBody = root.querySelector('#mapBody');
    if (mapBody) {
      const jobs = uniqueJobs(state.records).sort((a,b)=>a.localeCompare(b));
      mapBody.innerHTML = jobs.map(j => {
        const recs = state.records.filter(r=>r.jobRaw===j);
        const count = recs.length;
        const succ = recs.filter(r=>r.statusNorm==='success').length;
        const uns = count - succ;
        const m = state.jobMap[j] || {buildName:'', module:'', env:''};
        const masterOptions = (state.master||[]).map(mp => `<option value="${mp.buildName}" ${m.buildName===mp.buildName?'selected':''}>${mp.buildName}</option>`).join('');
        return `<tr data-job="${encodeURIComponent(j)}">
          <td class="jobcell">${j}</td>
          <td class="muted">${count}</td>
          <td><span class="pill success">${succ} ok</span> ${uns?`<span class="pill failed">${uns} other</span>`:''}</td>
          <td><select class="bnSelect"><option value="">— select —</option>${masterOptions}</select></td>
          <td><input type="text" class="modInput" value="${m.module||''}" placeholder="e.g. adminapi"></td>
          <td><select class="envSelect">
            <option value="">—</option>
            ${ENVS.map(e=>`<option value="${e}" ${m.env===e?'selected':''}>${e}</option>`).join('')}
          </select></td>
        </tr>`;
      }).join('');
      mapBody.querySelectorAll('tr').forEach(tr => {
        const job = decodeURIComponent(tr.dataset.job);
        const bnSelect = tr.querySelector('.bnSelect');
        const modInput = tr.querySelector('.modInput');
        const envSelect = tr.querySelector('.envSelect');
        bnSelect.onchange = () => { state.jobMap[job] = state.jobMap[job]||{}; state.jobMap[job].buildName = bnSelect.value; saveJobMap(); render(); };
        modInput.onchange = () => { state.jobMap[job] = state.jobMap[job]||{}; state.jobMap[job].module = modInput.value.trim(); saveJobMap(); };
        envSelect.onchange = () => { state.jobMap[job] = state.jobMap[job]||{}; state.jobMap[job].env = envSelect.value; saveJobMap(); render(); };
      });
    }
    const reGuessBtn = root.querySelector('#reGuessBtn');
    if (reGuessBtn) reGuessBtn.onclick = () => {
      uniqueJobs(state.records).forEach(j => {
        state.jobMap[j] = { buildName: guessBuildName(j), module: '', env: guessEnv(j) };
      });
      saveJobMap();
      render();
      toast('Re-guessed all mappings');
    };

    const masterBody = root.querySelector('#masterBody');
    if (masterBody) {
      masterBody.innerHTML = (state.master||[]).map((m,idx) => `
        <tr data-idx="${idx}">
          <td class="muted">${idx+1}</td>
          <td><input type="text" class="mBn" value="${m.buildName}"></td>
          <td><input type="text" class="mPn" value="${m.projectName}"></td>
          <td><input type="text" class="mSrv" value="${m.server}"></td>
          <td><div class="btn warn delRow" style="padding:4px 8px;">✕</div></td>
        </tr>`).join('');
      masterBody.querySelectorAll('tr').forEach(tr => {
        const idx = +tr.dataset.idx;
        tr.querySelector('.mBn').onchange = (e) => { state.master[idx].buildName = e.target.value.trim(); saveMaster(); };
        tr.querySelector('.mPn').onchange = (e) => { state.master[idx].projectName = e.target.value.trim(); saveMaster(); };
        tr.querySelector('.mSrv').onchange = (e) => { state.master[idx].server = e.target.value.trim(); saveMaster(); };
        tr.querySelector('.delRow').onclick = () => { state.master.splice(idx,1); saveMaster(); render(); };
      });
    }
    const addMasterRow = root.querySelector('#addMasterRow');
    if (addMasterRow) addMasterRow.onclick = () => {
      state.master.push({buildName:'', projectName:'', server:''});
      saveMaster();
      render();
    };

    const exportBtn = root.querySelector('#exportBtn');
    if (exportBtn) exportBtn.onclick = () => exportXlsx(matrix, buildNames, s);
  }

  function exportXlsx(matrix, buildNames, s){
    const header = ['#','Build Name','Project Name','Jenkin Server','Module', ...ENVS, 'Total','STATUS'];
    const rows = [header];
    let idx = 0;
    buildNames.forEach(bn => {
      const meta = masterByName(bn) || {projectName:'', server:''};
      const modules = matrix[bn];
      const modKeys = Object.keys(modules);
      const multiModule = modKeys.length > 1 || (modKeys.length===1 && modKeys[0] !== '');
      idx++;
      if (!multiModule) {
        const row = modules[modKeys[0]] || {};
        const cells = ENVS.map(e => row[e]||0);
        const total = cells.reduce((a,b)=>a+b,0);
        rows.push([idx, bn, meta.projectName, meta.server, '', ...cells, total, 'ACTIVE']);
      } else {
        const totalCells = ENVS.map(e=>{ let v=0; modKeys.forEach(mod=> v+= (modules[mod][e]||0)); return v; });
        const projectTotal = totalCells.reduce((a,b)=>a+b,0);
        rows.push([idx, bn, meta.projectName, meta.server, '', ...totalCells, projectTotal, 'ACTIVE']);
        modKeys.forEach(mod => {
          const row = modules[mod];
          const cells = ENVS.map(e => row[e]||0);
          const total = cells.reduce((a,b)=>a+b,0);
          rows.push(['', bn, meta.projectName, meta.server, mod||'(unspecified)', ...cells, total, '']);
        });
      }
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:4},{wch:18},{wch:40},{wch:16},{wch:16},...ENVS.map(()=>({wch:8})),{wch:8},{wch:9}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Build Matrix');

    const sumRows = [
      ['Month', state.month],
      ['Total build records', s.total],
      ['Successful', s.success],
      ['Unsuccessful (total)', s.unsuccessful],
      ['  Failed', s.failed],
      ['  Aborted', s.unstable],
      ['  Unclassified (?)', s.unknown],
    ];
    const wsSum = XLSX.utils.aoa_to_sheet(sumRows);
    wsSum['!cols'] = [{wch:24},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsSum, 'Summary');

    const rawHeader = ['MONTH','Job name','Build #','Status','Successful','Unsuccessful','Build Name','Module','Env'];
    const rawRows = [rawHeader];
    state.records.forEach(r => {
      const m = state.jobMap[r.jobRaw] || {};
      rawRows.push([
        state.month, r.jobRaw, r.build, r.statusRaw,
        r.statusNorm==='success'?1:0,
        r.statusNorm!=='success'?1:0,
        m.buildName||'', m.module||'', m.env||''
      ]);
    });
    const ws2 = XLSX.utils.aoa_to_sheet(rawRows);
    ws2['!cols'] = [{wch:9},{wch:35},{wch:8},{wch:24},{wch:10},{wch:11},{wch:18},{wch:16},{wch:8}];
    XLSX.utils.book_append_sheet(wb, ws2, 'Raw Records');

    XLSX.writeFile(wb, `${state.month}_Build_Matrix_Report.xlsx`);
    toast('Exported .xlsx');
  }

  loadState().then(render);
})();
</script>
